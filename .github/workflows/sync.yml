name: Sync CAA Drone Data

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test VPN isolation logic
        run: python3 -m unittest discover -s tests -v

      - name: Build isolated VPN fetcher
        run: docker build -t caa-sync-vpn:local scripts/vpn

      - name: Sync and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_USE_VPN: "true"
          WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
        run: bash scripts/release.sh
